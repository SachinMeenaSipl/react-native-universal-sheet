name: Docs

# Builds the documentation site (website/ + docs/) and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://sachinmeenasipl.github.io/react-native-universal-sheet/
on:
  push:
    branches: [main]
    paths: ['docs/**', 'website/**', 'src/**', 'package.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

      - name: Publish to gh-pages
        working-directory: website/.vitepress/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy docs from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
